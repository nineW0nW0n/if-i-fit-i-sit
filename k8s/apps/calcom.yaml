---
apiVersion: v1
kind: Namespace
metadata:
  name: booking
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calcom-db
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calcom-db
  template:
    metadata:
      labels:
        app: calcom-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: calcom
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: calcom-secrets
                  key: CAL_DB_PWD
            - name: POSTGRES_DB
              value: calcom
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: calcom-db
  namespace: booking
spec:
  ports:
    - port: 5432
  selector:
    app: calcom-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calcom
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calcom
  template:
    metadata:
      labels:
        app: calcom
    spec:
      containers:
        - name: calcom
          image: calcom/cal.com:latest
          env:
            - name: CAL_DB_PWD
              valueFrom:
                secretKeyRef:
                  name: calcom-secrets
                  key: CAL_DB_PWD
            - name: DATABASE_URL
              value: postgresql://calcom:$(CAL_DB_PWD)@calcom-db:5432/calcom
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: calcom-secrets
                  key: CAL_AUTH_KEY
            - name: CALENDSO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: calcom-secrets
                  key: CAL_ENC_KEY
            - name: NEXT_PUBLIC_WEBAPP_URL
              value: https://booking.maybeit.work
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: calcom-service
  namespace: booking
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: calcom
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calcom-ingress
  namespace: booking
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: booking.maybeit.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calcom-service
                port:
                  number: 3000
