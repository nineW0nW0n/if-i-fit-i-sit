---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alloy-config
  namespace: monitoring
data:
  config.alloy.template: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    prometheus.exporter.unix "node_exporter" {
      rootfs_path = "/host/root"
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
    }

    prometheus.scrape "alloy" {
      targets    = prometheus.exporter.unix.node_exporter.targets
      forward_to = [prometheus.relabel.add_node.receiver]
    }

    prometheus.relabel "add_node" {
      forward_to = [prometheus.remote_write.grafana_cloud.receiver]

      rule {
        target_label = "node"
        replacement  = "${NODE_NAME}"
      }
      rule {
        target_label = "instance"
        replacement  = "${NODE_NAME}"
      }
    }

    prometheus.remote_write "grafana_cloud" {
      endpoint {
        url = "${GCM_URL}"
        basic_auth {
          username = "${GCM_USER}"
          password = "${GCM_TOKEN}"
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: alloy
          image: grafana/alloy:v1.0.0
          command:
            - /bin/sh
            - -c
            - |
              sed -e "s|\${GCM_URL}|$GCM_URL|g" \
                  -e "s|\${GCM_USER}|$GCM_USER|g" \
                  -e "s|\${GCM_TOKEN}|$GCM_TOKEN|g" \
                  -e "s|\${NODE_NAME}|$NODE_NAME|g" \
                  /etc/alloy/template/config.alloy.template \
                  > /tmp/config.alloy && \
              alloy run /tmp/config.alloy
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GCM_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: GCM_URL
            - name: GCM_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: GCM_USER
            - name: GCM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: GCM_TOKEN
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/template
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
