name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck & Yamllint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck yamllint
          shellcheck bootstrap/*.sh
          yamllint .

      # ACTUALLY EXECUTE THE SCRIPT IN A DEBIAN CONTAINER
      - name: Test bootstrap script on clean Debian 12
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace debian:12-slim bash -c "
            apt-get update && apt-get install -y sudo ufw iptables curl
            bash bootstrap/setup-node.sh test-node
          "