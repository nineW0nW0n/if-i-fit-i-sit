---
name: Deploy to K3s Cluster

"on":
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
          kubeconfig-encoding: base64

      - name: Verify Cluster Connection
        run: |
          kubectl get nodes -o wide
          kubectl cluster-info

      - name: Create Namespaces & Secrets
        run: |
          # Monitoring Secret
          kubectl create namespace monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic grafana-cloud-credentials \
            --namespace=monitoring \
            --from-literal=GCM_URL="${{ secrets.GCM_URL }}" \
            --from-literal=GCM_USER="${{ secrets.GCM_USER }}" \
            --from-literal=GCM_TOKEN="${{ secrets.GCM_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Cloudflare Tunnel Secret
          kubectl create namespace kube-system \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic cloudflare-tunnel-token \
            --namespace=kube-system \
            --from-literal=TUNNEL_TOKEN="${{ secrets.CF_TUNNEL_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy All Kubernetes Manifests
        run: |
          kubectl apply -R -f k8s/
