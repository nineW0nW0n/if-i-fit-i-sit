---
name: Deploy to K3s Cluster

"on":
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
          kubeconfig-encoding: base64

      - name: Verify Cluster Connection
        run: |
          kubectl get nodes -o wide
          kubectl cluster-info

      - name: Create Namespaces & Secrets
        run: |
          # Monitoring Namespace & Token Secret
          kubectl create namespace monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic beszel-token \
            --namespace=monitoring \
            --from-literal=BESZEL_TKN="${{ secrets.BESZEL_TKN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Cloudflare Tunnel Secret
          kubectl create namespace kube-system \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic cloudflare-tunnel-token \
            --namespace=kube-system \
            --from-literal=CLF_TUN_TKN="${{ secrets.CLF_TUN_TKN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy All Kubernetes Manifests
        run: |
          kubectl apply -R -f k8s/
